name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        # ruff is pinned: its default rule set changes between releases,
        # so an unpinned linter turns this check red on nobody's commit.
        run: python -m pip install --quiet pyyaml 'ruff==0.16.8'

      - name: Lint
        run: ruff check .

      - name: Slicer tests
        run: cd slicer/tests && python -m unittest discover -q

      - name: Driver tests
        run: cd graph/tests && python -m unittest discover -q

      - name: Nothing local travels
        run: bash scripts/scrub-check.sh
