name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml ruff

      - name: Lint
        run: ruff check .

      - name: Slicer tests
        run: cd slicer/tests && python -m unittest discover -q

      - name: Driver tests
        run: cd drive/tests && python -m unittest discover -q

      - name: Nothing local travels
        run: bash scripts/scrub-check.sh
