name: Release

# The plugin manifest is the one place a version is written. This workflow reads
# it, tags that version, and refuses to run if the tag already exists — which is
# what "you forgot to bump it" looks like. Bumping is a human edit in a pull
# request, so the workflow never commits to main and can never trigger itself.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Read the version from the plugin manifest
        id: version
        run: |
          set -euo pipefail
          manifest=plugins/graph/.claude-plugin/plugin.json
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest does not exist yet — nothing to release."
            exit 1
          fi
          version=$(python3 -c "import json,sys; print(json.load(open('$manifest'))['version'])")
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Version '$version' is not semver."; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists. Bump the version in $manifest first."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Tag and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions[bot]"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
