<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" width="1000" height="620"
     aria-label="The plan phase turns a brief into reviewed cards in a vault. The build phase takes one card at a time through a red-first proof, a contract review, a private worktree, the gate, a diff review and a commit. A card that keeps failing parks, and the next plan phase slices it again.">
<style>
  .band-p { fill: #6ee7a80f; } .band-b { fill: #d7a2520f; }
  .box { fill: #13181d; stroke: #222a31; stroke-width: 1.5; }
  .vault { fill: none; stroke: #222a31; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .note { fill: #13181d; stroke: #98a3ac; stroke-width: 1.2; }
  .link { stroke: #98a3ac; stroke-width: 1; fill: none; }
  text { font-family: ui-sans-serif, system-ui, Helvetica, Arial, sans-serif; }
  .ttl { font-size: 13px; font-weight: 600; fill: #e7ebee; }
  .sub { font-size: 11.5px; fill: #98a3ac; }
  .cmd { font-size: 11.5px; fill: #98a3ac; font-family: ui-monospace, Menlo, monospace; }
  .phase-p { font-size: 14px; font-weight: 700; fill: #6ee7a8; letter-spacing: .12em; }
  .phase-b { font-size: 14px; font-weight: 700; fill: #d7a252; letter-spacing: .12em; }
  .chk { font-size: 11px; font-weight: 500; fill: #6ee7a8; }
  .flow { fill: none; stroke: #e7ebee; stroke-width: 1.5; marker-end: url(#tip); }
  .bad { fill: none; stroke: #e5806f; stroke-width: 1.5; marker-end: url(#tipbad); }
  .badline { fill: none; stroke: #e5806f; stroke-width: 1.5; }
  .badtxt { font-size: 11.5px; font-weight: 500; fill: #e5806f; }
</style>
<defs>
  <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e7ebee"/></marker>
  <marker id="tipbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5806f"/></marker>
</defs>

<rect class="band-p" x="12" y="18" width="252" height="566" rx="14"/>
<rect class="band-b" x="616" y="18" width="372" height="566" rx="14"/>
<text class="phase-p" x="138" y="46" text-anchor="middle">PLAN</text>
<text class="cmd" x="138" y="64" text-anchor="middle">graph-goal.py plan</text>
<text class="phase-b" x="797" y="46" text-anchor="middle">BUILD</text>
<text class="cmd" x="797" y="64" text-anchor="middle">graph-goal.py run · up to 3 cards at once</text>

<rect class="box" x="30" y="84" width="216" height="52" rx="8"/>
<text class="ttl" x="46" y="108">Brief</text>
<text class="sub" x="46" y="125">what you want built, in a paragraph</text>
<rect class="box" x="30" y="190" width="216" height="52" rx="8"/>
<text class="ttl" x="46" y="214">Branch writer</text>
<text class="chk" x="230" y="214" text-anchor="end">reviewed</text>
<text class="sub" x="46" y="231">brief → the branch goals</text>
<rect class="box" x="30" y="296" width="216" height="52" rx="8"/>
<text class="ttl" x="46" y="320">Speccer</text>
<text class="chk" x="230" y="320" text-anchor="end">reviewed</text>
<text class="sub" x="46" y="337">one goal → one small spec</text>
<rect class="box" x="30" y="402" width="216" height="52" rx="8"/>
<text class="ttl" x="46" y="426">Slicer</text>
<text class="chk" x="230" y="426" text-anchor="end">reviewed</text>
<text class="sub" x="46" y="443">spec and code → one card each</text>
<path class="flow" d="M138 136 V 184"/>
<path class="flow" d="M138 242 V 290"/>
<path class="flow" d="M138 348 V 396"/>

<rect class="vault" x="350" y="96" width="180" height="384" rx="12"/>
<text class="ttl" x="440" y="124" text-anchor="middle">The vault</text>
<g class="link">
  <path d="M398 172 L 478 208"/><path d="M398 172 L 404 254"/><path d="M478 208 L 484 300"/>
  <path d="M404 254 L 484 300"/><path d="M404 254 L 410 346"/><path d="M410 346 L 478 392"/>
</g>
<g class="note">
  <rect x="370" y="161" width="56" height="22" rx="5"/><rect x="450" y="197" width="56" height="22" rx="5"/>
  <rect x="376" y="243" width="56" height="22" rx="5"/><rect x="456" y="289" width="56" height="22" rx="5"/>
  <rect x="382" y="335" width="56" height="22" rx="5"/><rect x="450" y="381" width="56" height="22" rx="5"/>
</g>
<text class="sub" x="440" y="432" text-anchor="middle">one note per card</text>
<text class="sub" x="440" y="448" text-anchor="middle">[[wikilinks]] are the graph</text>
<text class="sub" x="440" y="464" text-anchor="middle">the loop writes only status</text>
<path class="flow" d="M246 428 H 300 V 290 H 344"/>
<text class="sub" transform="rotate(-90 292 360)" x="292" y="360" text-anchor="middle">every card, before any build</text>
<path class="flow" d="M530 290 H 578 V 113 H 630"/>
<text class="sub" transform="rotate(-90 570 210)" x="570" y="210" text-anchor="middle">one startable card</text>

<rect class="box" x="636" y="90" width="322" height="46" rx="8"/>
<text class="ttl" x="652" y="110">Pick a card</text>
<text class="sub" x="652" y="126">a card a person holds is never started</text>
<rect class="box" x="636" y="160" width="322" height="46" rx="8"/>
<text class="ttl" x="652" y="180">Prove the gate red</text>
<text class="sub" x="652" y="196">a gate that has never failed proves nothing</text>
<rect class="box" x="636" y="230" width="322" height="46" rx="8"/>
<text class="ttl" x="652" y="250">Contract review</text>
<text class="sub" x="652" y="266">a reviewer reads the card before any edit</text>
<rect class="box" x="636" y="300" width="322" height="46" rx="8"/>
<text class="ttl" x="652" y="320">Build in a private worktree</text>
<text class="sub" x="652" y="336">fast model first, and only the card's own files</text>
<rect class="box" x="636" y="370" width="322" height="46" rx="8"/>
<text class="ttl" x="652" y="390">Run the gate</text>
<text class="sub" x="652" y="406">the exit code is the verdict</text>
<rect class="box" x="636" y="440" width="322" height="46" rx="8"/>
<text class="ttl" x="652" y="460">Diff review</text>
<text class="sub" x="652" y="476">a fresh reviewer, never the builder's model</text>
<rect class="box" x="636" y="510" width="322" height="46" rx="8"/>
<text class="ttl" x="652" y="530">Keep it on the campaign branch</text>
<text class="sub" x="652" y="546">the next card starts from that commit</text>
<path class="flow" d="M797 136 V 154"/><path class="flow" d="M797 206 V 224"/>
<path class="flow" d="M797 276 V 294"/><path class="flow" d="M797 346 V 364"/>
<path class="flow" d="M797 416 V 434"/><path class="flow" d="M797 486 V 504"/>

<path class="badline" d="M958 393 H 976"/>
<path class="bad" d="M958 463 H 976 V 323 H 962"/>
<text class="badtxt" transform="rotate(-90 988 393)" x="988" y="393" text-anchor="middle">3 rounds</text>
<path class="bad" d="M636 463 H 600 V 522 H 460 V 486"/>
<text class="badtxt" x="524" y="512" text-anchor="middle">it parks, and says why</text>
<path class="bad" d="M420 480 V 556 H 138 V 460"/>
<text class="badtxt" x="286" y="550" text-anchor="middle">the card was wrong → slice it again</text>
</svg>
